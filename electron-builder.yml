appId: pk.packagingbox.invoice
productName: PackagingBox Invoice
copyright: Copyright © Packaging Box Pakistan

# Where `electron-builder --publish` sends the installer. The Release workflow
# creates it as a draft so the notes can be written before it goes public.
publish:
  provider: github
  owner: danial449
  repo: e-invoice
  releaseType: draft
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - resources/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PackagingBox Invoice
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
