appId: pk.packagingbox.invoice
productName: PackagingBox Invoice
copyright: Copyright © Packaging Box Pakistan

# Where `electron-builder --publish` sends the installer. Published straight
# away - a draft release is invisible on the Releases page, so the tag would be
# all anyone could see.
publish:
  provider: github
  owner: danial449
  repo: e-invoice
  releaseType: release

# The notes come from the matching section of CHANGELOG.md, written out by the
# Release workflow before packaging.
releaseInfo:
  releaseNotesFile: release-notes.md
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - resources/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PackagingBox Invoice
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
