# Deliberately unchanged across the rename to E-Invoice: Windows identifies an
# installed program by this id, so changing it would leave the old entry behind
# and install alongside it instead of upgrading. It is never shown to anyone.
appId: pk.packagingbox.invoice
productName: E-Invoice
copyright: Copyright © Packaging Box Pakistan

# Where `electron-builder --publish` sends the installer. Published straight
# away - a draft release is invisible on the Releases page, so the tag would be
# all anyone could see.
publish:
  provider: github
  owner: danial449
  repo: e-invoice
  releaseType: release

directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - resources/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: E-Invoice
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
