name: Release

# Publishes a Windows installer to GitHub Releases.
#
# Normal use: push a version tag and this does the rest.
#   npm version patch   # bumps package.json, commits, tags v1.0.1
#   git push --follow-tags
#
# The release is published immediately, with notes taken from the matching
# section of CHANGELOG.md, and the installer attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # electron-builder only packages what is already in out/. Without this
      # it exits with "application entry file out/main/index.js does not
      # exist", because `npm run dist` is what normally chains the two.
      - name: Compile main, preload and renderer
        run: npm run build

      - name: Check the compiled entry point exists
        shell: bash
        run: |
          test -f out/main/index.js || { echo 'out/main/index.js is missing - the build did not produce it.'; exit 1; }
          test -f out/preload/index.js || { echo 'out/preload/index.js is missing.'; exit 1; }
          test -f out/renderer/index.html || { echo 'out/renderer/index.html is missing.'; exit 1; }
          echo 'Build output looks complete:'
          ls -la out/main/index.js out/preload/index.js out/renderer/index.html

      - name: Release notes from the changelog
        shell: bash
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" release-notes.md
          echo '--- notes ---'
          cat release-notes.md

      - name: Package and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate, so skip the signing step rather than
          # failing the build. Users will see a SmartScreen prompt on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # electron-builder's releaseNotesFile is not applied when it publishes to
      # GitHub - the releases came out with an empty body - so the notes are
      # written onto the release afterwards, where it plainly works.
      - name: Put the changelog into the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          echo 'Notes set for '"${GITHUB_REF_NAME}"':'
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body | head -20

      - name: Attach the installer to the workflow run as well
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Confirm what was published
        if: always()
        shell: bash
        run: |
          echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          ls -la release/*.exe || echo 'No installer was produced.'
